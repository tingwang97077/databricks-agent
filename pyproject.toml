[project]
name = "tickermaster"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "databricks-sdk>=0.89.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I"]
fix = true
